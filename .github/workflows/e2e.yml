name: E2E

# Playwright multi-device tests against the local dev server (docs/architecture/platform.md,
# "Development topology"). Pull requests only: there are no preview deploys to test against.
on:
  pull_request:

# A new push to a pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs. Renovate keeps the SHA and version comment current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Browsers are cached per Playwright version (the pnpm catalog pins it).
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter ./e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      # System libraries live outside the cache, so they are installed on every run.
      - run: pnpm --filter ./e2e exec playwright install-deps chromium webkit

      # Installs any missing browser, creates apps/server/.dev.vars from the example (test values
      # only), starts `pnpm dev` and runs Chromium and WebKit.
      - run: pnpm e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
