name: Deploy

# Every merge to main deploys to workers.dev once CI has passed on that commit, then a smoke test
# creates a room on the live site (docs/architecture/platform.md, "Production topology").
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deploy at a time. A running deploy always finishes.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: gate
    # Only CI runs for a push to main that passed. Pull request runs never deploy.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - id: gate
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Until the owner adds the Cloudflare secrets, skip instead of failing.
          if [ "$HAS_API_TOKEN" != "true" ] || [ "$HAS_ACCOUNT_ID" != "true" ]; then
            echo "::notice::Deploy skipped: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CI runs for two quick merges can finish out of order. Only main's tip deploys, so an
          # older commit never replaces a newer one. The newer commit's own run deploys it.
          tip="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "::notice::Deploy skipped: $HEAD_SHA is no longer the tip of main ($tip)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://couchcade.dipsaus9.workers.dev
    steps:
      # Actions are pinned to full commit SHAs. Renovate keeps the SHA and version comment current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # Turnstile runs on every create and join (docs/architecture/security.md, "Where Turnstile
      # runs"). Without the site key the apps would ship Cloudflare's test key and every create and
      # join would fail. Without the smoke token the smoke test can't create a room. Stop first.
      - name: check the Turnstile settings
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          HAS_SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN != '' }}
        run: |
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "::error::Set the TURNSTILE_SITE_KEY Actions variable to the Turnstile widget's site key."
            exit 1
          fi
          if [ "$HAS_SMOKE_TOKEN" != "true" ]; then
            echo "::error::Set the SMOKE_TOKEN Actions secret to the same value as the Worker secret."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # Builds the host and controller, then assembles them into apps/server/dist/public. Both apps
      # read the public Turnstile site key at build time.
      - run: pnpm build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      # Lists the Worker's secret names (never values), so a deploy never goes out before the
      # Turnstile secret and the smoke token are set on the Worker.
      - id: worker-secrets
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
          packageManager: pnpm
          command: secret list --format json

      - name: check the Worker secrets
        env:
          SECRETS: ${{ steps.worker-secrets.outputs.command-output }}
        run: |
          for name in TURNSTILE_SECRET_KEY SMOKE_TOKEN; do
            if ! printf '%s' "$SECRETS" | grep -q "\"$name\""; then
              echo "::error::Set $name as a Worker secret with wrangler secret put $name."
              exit 1
            fi
          done

      # Uses the wrangler version from the lockfile, because no wranglerVersion is given.
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
          packageManager: pnpm
          command: deploy

      # Creates a room with the passcode and the smoke token, which skips only Turnstile, and opens
      # its socket. Any failure fails the workflow.
      - name: smoke test
        run: pnpm --filter @couchcade/smoke run smoke
        env:
          SMOKE_URL: https://couchcade.dipsaus9.workers.dev
          SMOKE_HOST_PASSCODE: ${{ secrets.SMOKE_HOST_PASSCODE }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
