<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CC-3.13 spike — TV</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #10131f;
        color: #fafcff;
        font-family: system-ui, sans-serif;
      }
      h1 {
        font-size: 20px;
      }
      #status {
        font-size: 18px;
        margin-bottom: 16px;
      }
      #field {
        position: relative;
        width: 300px;
        height: 300px;
        margin: 24px 0;
        border: 2px solid #37b26c;
        border-radius: 12px;
        background: #1e2a4a;
      }
      #dot {
        position: absolute;
        top: 150px;
        left: 150px;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border-radius: 50%;
        background: #ffc83d;
        transition: transform 40ms linear;
      }
      #log {
        font: 12px/1.5 monospace;
        opacity: 0.75;
        max-height: 200px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <h1>CC-3.13 spike — TV page</h1>
    <div id="status">Waiting…</div>
    <div id="field"><div id="dot"></div></div>
    <div id="log"></div>
    <script type="module" src="/src/tv.ts"></script>
  </body>
</html>
